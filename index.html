<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ColorTap Challenge</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      @keyframes scalePulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
        100% {
          transform: scale(1);
        }
      }
      .animate-pulse {
        animation: scalePulse 1.5s infinite;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <div
      class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-r from-purple-500 to-pink-500"
    >
      <div
        class="w-full max-w-4xl bg-white rounded-lg shadow-2xl overflow-hidden flex flex-col"
      >
        <!-- Game Header -->
        <div
          class="p-4 bg-gray-800 text-white flex justify-between items-center"
        >
          <div class="space-x-4">
            <span class="text-lg font-bold"
              >Score: <span id="score">0</span></span
            >
            <span class="text-lg">Time: <span id="timer">30</span>s</span>
            <span class="text-lg">Level: <span id="level">1</span></span>
          </div>
          <button
            id="startBtn"
            class="px-4 py-2 bg-green-500 rounded-lg hover:bg-green-600 transition-colors"
          >
            Start Game
          </button>
        </div>

        <div class="flex flex-col md:flex-row">
          <!-- Game Area -->
          <div
            class="flex-1 p-8 flex flex-col items-center justify-center min-h-64 transition-all duration-300"
          >
            <div id="targetDisplay" class="mb-6 text-center">
              <p class="text-4xl font-bold mb-2 text-gray-800"></p>
              <div
                class="w-32 h-32 mx-auto rounded-full shadow-lg border-4 border-white"
              ></div>
            </div>
            <p class="text-xl text-gray-600" id="message"></p>
          </div>

          <!-- Color Options -->
          <div class="w-full md:w-96 bg-gray-100 p-6">
            <h2 class="text-xl font-bold text-gray-700 mb-4">Color Options</h2>
            <ul class="grid grid-cols-2 gap-4 color-list"></ul>
          </div>
        </div>

        <!-- Progress Bar -->
        <div class="h-2 bg-gray-200">
          <div
            id="progressBar"
            class="h-full bg-green-500 transition-all duration-1000"
          ></div>
        </div>
      </div>
    </div>

    <script>
      const colors = [
        { label: "Blue", bgClass: "bg-sky-300", bgColor: "#7dd3fc" },
        { label: "Red", bgClass: "bg-red-300", bgColor: "#fca5a5" },
        { label: "Yellow", bgClass: "bg-yellow-300", bgColor: "#fde047" },
        { label: "Orange", bgClass: "bg-orange-300", bgColor: "#fdba74" },
        { label: "Green", bgClass: "bg-green-300", bgColor: "#86efac" },
        { label: "Purple", bgClass: "bg-purple-300", bgColor: "#d8b4fe" },
        { label: "Pink", bgClass: "bg-pink-300", bgColor: "#f9a8d4" },
        { label: "Cyan", bgClass: "bg-cyan-300", bgColor: "#67e8f9" },
      ];

      const gameState = {
        score: 0,
        timeLeft: 30,
        level: 1,
        isPlaying: false,
        currentTarget: null,
        timerId: null,
        colorsPerLevel: 4,
      };

      // DOM Elements
      const elements = {
        startBtn: document.getElementById("startBtn"),
        colorList: document.querySelector(".color-list"),
        targetDisplay: document.querySelector("#targetDisplay"),
        message: document.getElementById("message"),
        score: document.getElementById("score"),
        timer: document.getElementById("timer"),
        level: document.getElementById("level"),
        progressBar: document.getElementById("progressBar"),
      };

      // Game Functions
      function generateRandomColors(count) {
        const shuffled = [...colors].sort(() => 0.5 - Math.random());
        return shuffled.slice(0, count);
      }

      function setTargetColor() {
        const currentColors = Array.from(
          document.querySelectorAll(".color-option")
        );
        const correctColor =
          currentColors[Math.floor(Math.random() * currentColors.length)];
        const isHexChallenge = gameState.level > 3 && Math.random() > 0.6;
        const isShadeChallenge = gameState.level > 5 && Math.random() > 0.5;

        const targetElement = elements.targetDisplay;
        const [nameDisplay, colorDisplay] = targetElement.children;

        if (isShadeChallenge) {
          const baseColor = correctColor.dataset.color;
          const shadeColor = `${baseColor}${
            Math.floor(Math.random() * 300) + 100
          }`;
          nameDisplay.textContent = `Find ${correctColor.dataset.label} Shade`;
          colorDisplay.style.backgroundColor = shadeColor;
        } else if (isHexChallenge) {
          nameDisplay.textContent = correctColor.dataset.color.toUpperCase();
          colorDisplay.style.backgroundColor = correctColor.dataset.color;
        } else {
          nameDisplay.textContent = correctColor.dataset.label;
          colorDisplay.style.backgroundColor = correctColor.dataset.color;
        }

        targetElement.classList.add("animate-pulse");
        gameState.currentTarget = correctColor.dataset.color;
      }

      function handleColorClick(e) {
        if (!gameState.isPlaying) return;

        const colorElement = e.target.closest(".color-option");
        const isCorrect =
          colorElement.dataset.color === gameState.currentTarget;

        if (isCorrect) {
          gameState.score += gameState.level * 10;
          elements.message.textContent = "Correct! +" + gameState.level * 10;
          elements.message.className = "text-green-500 text-xl";
          gameState.timeLeft += 3;
          if (gameState.score % (gameState.level * 100) === 0) {
            gameState.level++;
            gameState.colorsPerLevel = Math.min(8, 4 + gameState.level);
          }
        } else {
          gameState.score = Math.max(0, gameState.score - 20);
          elements.message.textContent = "Wrong! -20";
          elements.message.className = "text-red-500 text-xl";
          gameState.timeLeft -= 2;
        }

        elements.score.textContent = gameState.score;
        elements.level.textContent = gameState.level;
        updateColorOptions();
        setTargetColor();
      }

      function updateColorOptions() {
        elements.colorList.innerHTML = "";
        const colorOptions = generateRandomColors(gameState.colorsPerLevel);

        colorOptions.forEach((color) => {
          const li = document.createElement("li");
          li.className = `${color.bgClass} p-4 rounded-lg cursor-pointer color-option hover:scale-105 transition-transform duration-200`;
          li.dataset.label = color.label;
          li.dataset.color = color.bgColor;
          li.innerHTML = `
            <div class="text-center">
              <p class="font-semibold">${color.label}</p>
              <p class="text-sm opacity-75">${color.bgColor}</p>
            </div>
          `;
          li.addEventListener("click", handleColorClick);
          elements.colorList.appendChild(li);
        });
      }

      function gameLoop() {
        elements.progressBar.style.width = `${
          (gameState.timeLeft / 30) * 100
        }%`;
        elements.timer.textContent = gameState.timeLeft;

        if (gameState.timeLeft <= 0) {
          endGame();
          return;
        }

        gameState.timeLeft--;
      }

      function startGame() {
        if (gameState.isPlaying) return;

        gameState.isPlaying = true;
        gameState.score = 0;
        gameState.timeLeft = 30;
        gameState.level = 1;
        elements.startBtn.disabled = true;
        elements.message.textContent = "Match the color!";
        elements.targetDisplay.classList.remove("hidden");

        updateColorOptions();
        setTargetColor();
        gameState.timerId = setInterval(gameLoop, 1000);
      }

      function endGame() {
        gameState.isPlaying = false;
        clearInterval(gameState.timerId);
        elements.startBtn.disabled = false;
        elements.targetDisplay.classList.add("hidden");
        elements.message.innerHTML = `Game Over! Final Score: ${gameState.score}<br>
          <button onclick="startGame()" class="mt-4 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
            Play Again
          </button>`;
        elements.progressBar.style.width = "100%";
      }

      // Event Listeners
      elements.startBtn.addEventListener("click", startGame);
    </script>
  </body>
</html>
